# CI publishes preview packages as GitHub Actions artifacts. This workflow links
# successful builds without checking out or executing the artifact's code.
name: Preview packages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  summary:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
      github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Link preview artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id,
            });
            const artifact = artifacts.find((entry) => entry.name === 'preview-packages' && !entry.expired);
            if (!artifact) {
              core.notice('CI produced no preview packages.');
              return;
            }
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            await core.summary
              .addHeading('no-mistakes preview packages', 3)
              .addLink('Download the package set', `${run.html_url}/artifacts/${artifact.id}`)
              .addCodeBlock(`gh run download ${run.id} --repo ${repo} --name preview-packages --dir /tmp/no-mistakes-preview`, 'sh')
              .addRaw('From a no-mistakes source checkout, connect an external npm project to the downloaded package set:\n')
              .addCodeBlock('node scripts/use-local-packages.mjs --manifest /tmp/no-mistakes-preview/manifest.json --consumer /path/to/project --package @no-mistakes/coding-agent\ncd /path/to/project\nnpm install --ignore-scripts', 'sh')
              .write();
